version: '3.8'

services:
  rag-app:
    build: .
    container_name: rag-system
    ports:
      - "8501:8501"
    environment:
      - LLAMA_API_KEY=${LLAMA_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - ./vector_db:/app/vector_db
      - ./data/processed:/app/data/processed
    user: "root"  
    restart: unless-stopped